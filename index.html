<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdvikPlayz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Jost", Arial, Helvetica, sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: #647084;
      font-size: 17px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .card {
      display: block;
      min-height: 180px;
      padding: 22px;
      border: 1px solid #d8deea;
      border-radius: 8px;
      background: #ffffff;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(23, 32, 51, 0.08);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 34px rgba(23, 32, 51, 0.12);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .card p {
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .url {
      color: #2563eb;
      font-size: 14px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AdvikPlayz.github.io</h1>
      <p>Websites on AdvikPlayz.github.io</p>
    </header>

    <section class="cards" aria-label="Website links">
      <a class="card" href="https://advikplayz.github.io/AK64ChessHub/">
        <h2>AK64 Chess Hub</h2>
        <p>Chess lessons and information.</p>
        <span class="url">AdvikPlayz.github.io/AK64ChessHub/</span>
      </a>
    </section>
  </main>
</body>
</html>
